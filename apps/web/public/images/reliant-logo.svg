<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Left Shield Icon -->
  <g transform="translate(20, 22)" filter="url(#subtleShadow)">
    <path d="M38 4L68 15V42C68 62 48 74 38 78C28 74 8 62 8 42V15L38 4Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M38 10L62 19V40C62 56 46 66 38 70C30 66 14 56 14 40V19L38 10Z" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="2 2" stroke-opacity="0.6"/>
    <path d="M25 40L33 48L51 29" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="38" cy="18" r="2" fill="#fbbf24"/>
  </g>

  <!-- Brand Typography -->
  <text x="110" y="38" fill="#d97706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="11" font-weight="800" letter-spacing="2.2">INDEPENDENT VERIFICATION NETWORK</text>
  <text x="110" y="70" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="-0.5">Reliant <tspan fill="#b45309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900">VERIFIED</tspan></text>
  <text x="112" y="90" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.8">COMMERCIAL FLEET &amp; SPECIALTY CONTRACTOR DISPATCH</text>
  
  <g transform="translate(425, 36)">
    <rect x="0" y="0" width="92" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="12" cy="13" r="4" fill="#10b981"/>
    <text x="22" y="17" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" letter-spacing="0.6">AUTHENTIC</text>
  </g>
</svg>
