name: Autonomous Directory Health & Maintenance

on:
  schedule:
    # Runs daily at 06:00 UTC (2:00 AM EST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  health-and-maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Production Health Audit
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - << 'EOF'
          import urllib.request
          import json
          import sys

          BASE_URL = "https://reliant-network.vercel.app"
          endpoints = [
              "/api/health",
              "/operator-portal.html",
              "/financing.html",
              "/badge-generator.html",
              "/cost/atlanta.html",
              "/permits/atlanta-ga",
              "/best/atlanta-ga",
              "/vs/united-rentals-alternative",
              "/badges/verified-2026.svg",
              "/sitemap.xml"
          ]

          failed = []
          for ep in endpoints:
              url = BASE_URL + ep
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Reliant-Autonomous-Monitor/1.0'})
                  res = urllib.request.urlopen(req, timeout=20)
                  code = res.getcode()
                  print(f"[HTTP {code}] {url} - OK")
                  if code != 200:
                      failed.append((url, code))
              except Exception as e:
                  print(f"[FAIL] {url} - Error: {e}")
                  failed.append((url, str(e)))

          if failed:
              print(f"\n[ALERT] {len(failed)} endpoints failed verification!")
              sys.exit(1)
          else:
              print("\nAll production services healthy and operational.")
          EOF

      - name: Validate Sitemap URL Count & XML Well-Formedness
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - << 'EOF'
          import urllib.request
          import xml.etree.ElementTree as ET

          sitemap_url = "https://reliant-network.vercel.app/sitemap.xml"
          req = urllib.request.Request(sitemap_url, headers={'User-Agent': 'Reliant-Autonomous-Monitor/1.0'})
          xml_data = urllib.request.urlopen(req, timeout=20).read()
          root = ET.fromstring(xml_data)
          urls = root.findall('{http://www.sitemaps.org/schemas/sitemap/0.9}url')
          print(f"Indexed Sitemap URLs: {len(urls)}")
          assert len(urls) >= 150, f"Sitemap URL count unexpectedly low ({len(urls)})"
          print("Sitemap integrity and XML structure verified.")
          EOF
