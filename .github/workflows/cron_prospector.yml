name: Autonomous Prospector Engine

on:
  schedule:
    # Run every day at 08:00 UTC (4 AM EST)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  run-prospector:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push changes back to the repo
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run Prospector Engine
        run: python scripts/autonomous_prospector.py
        
      - name: Commit newly discovered prospects back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add services/data/vendors.json || true
          git add reliant_outbound_campaign_expanded_v2.csv || true
          git commit -m "chore(prospects): autonomous extraction added new targets" || exit 0
          git push
